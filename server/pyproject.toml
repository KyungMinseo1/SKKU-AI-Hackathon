[project]
name = "askkup-server"
version = "0.1.0"
description = "ASKKUP FastAPI server"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "google-genai>=2.27.0",
    "numpy>=2.4.6",
    "openai>=2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
